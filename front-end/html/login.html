<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/login.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Clinica Veterinaria - Login</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="logo">
                <img src="../image/pet.png" alt="Icone da Logo">
                <h2> Bem-Vindo ! </h2>
            </div>

            <div class="form">
                <input type="text" placeholder="Usuário" id="usuario">
                <input type="password" placeholder="Senha" id="senha">
                <button type="submit" class="btn-abrir" id="abrirModal" > Login </button>
            </div>

            <div class="modal-overlay" id="modalOverlay">
                <div class="modal-content">
                    <button class="btn-fechar" id="fecharModal">&times;</button>
                    <h2>Olá, <span>(Nome do Usuário)</span>!</h2>
                    <p>Bem-Vindo de volta, espero que seu dia de trabalho seja maravilhoso. 💕</p>
                    <a href="../html/index.html">Continuar</a>
                </div>
            </div>
        </div>
    </main>
    <script src="../script/login.js"></script>
</body>
</html>
