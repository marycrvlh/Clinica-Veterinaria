<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style/login.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <title>Clinica Veterinaria - Login</title>
</head>
<body>
    <main>
        <div class="container">
            <div class="logo">
                <img src="../image/pet.png" alt="Icone da Logo">
                <h2> Bem-Vindo ! </h2>
            </div>

            <div class="form">
                <input type="text" placeholder="Usuário" id="usuario">
                <input type="password" placeholder="Senha" id="senha">
                <button type="submit" id="botao-login"> Login </button>
            </div>
        </div>
    </main>
    <script href="../script/login.js"></script>
</body>
</html>
